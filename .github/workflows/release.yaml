# Build and publish ghcr.io/krateo-blueprints/keystone-oidc.
#
# Two tags are pushed for every build:
#
#   <series>-<distro>            the CONTRACT tag, e.g. 2026.1-ubuntu_noble.
#                                Blueprints pin this; it is what the child's
#                                Keystone actually pulls.
#   <series>-<distro>-<version>  an IMMUTABLE tag per release, so a specific
#                                build can be pinned or rolled back to.
#
# The contract tag is DERIVED from the Dockerfile's FROM line, never written here.
# It used to be a literal, so moving the base to another series would have
# republished the old tag with a different Keystone inside: a 2025.1 tag carrying
# 2026.1. Derived, the tag always names the series inside it, and a tag that has
# already been published keeps the image it had. (2025.1-ubuntu_jammy stays as
# built from the 2025.1 base.)
#
# The image tag deliberately does NOT follow the org's bare-semver rule. That
# rule governs CHART releases; this tag mirrors the upstream OpenStack/LOCI
# convention because it has to match what the base publishes and what existing
# blueprints already reference. Git tags here are still bare semver.

name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/keystone-oidc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        run: |
          set -euo pipefail
          # The contract tag is the base's own tag. The base must be pinned by
          # digest as well, or the tag alone would silently change what we ship.
          from=$(grep -E '^FROM ' Dockerfile)
          [ "$(grep -cE '^FROM ' Dockerfile)" = 1 ] || { echo "::error::Dockerfile must have exactly one FROM"; exit 1; }
          CONTRACT_TAG=$(printf '%s\n' "$from" | sed -nE 's#^FROM quay\.io/airshipit/keystone:([0-9]{4}\.[12]-ubuntu_[a-z]+)@sha256:[0-9a-f]{64}$#\1#p')
          [ -n "$CONTRACT_TAG" ] || { echo "::error::FROM must be quay.io/airshipit/keystone:<series>-ubuntu_<distro>@sha256:<digest>, got: $from"; exit 1; }
          echo "CONTRACT_TAG=${CONTRACT_TAG}" >> "$GITHUB_ENV"
          # Tag builds get the immutable second tag; manual runs only move the
          # contract tag, so a dispatch cannot silently mint a fake version.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TAGS=${IMAGE}:${CONTRACT_TAG},${IMAGE}:${CONTRACT_TAG}-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAGS=${IMAGE}:${CONTRACT_TAG}" >> "$GITHUB_ENV"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only — deliberately, and verified rather than assumed. Both the
          # Airship base and the braghettos image this replaces publish exactly one
          # architecture (linux/amd64); their index carries a second entry only
          # because buildkit attaches an unknown/unknown attestation manifest,
          # which is easy to misread as multi-arch. Requesting arm64 fails the
          # build outright: "no match for platform in manifest".
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          provenance: false

      - name: Verify mod_auth_openidc is actually present
        run: |
          set -euo pipefail
          # The entire reason this image exists is one Apache module. A build that
          # succeeds without it is worse than a failed build: federation breaks at
          # runtime, far from the cause.
          docker run --rm --entrypoint /bin/sh "${IMAGE}:${CONTRACT_TAG}" -c \
            'test -f /usr/lib/apache2/modules/mod_auth_openidc.so' \
            && echo "mod_auth_openidc.so present"

      - name: Verify the image's Keystone and OS are the series its tag names
        run: |
          set -euo pipefail
          # The tag is derived from FROM, but what decides compatibility is what is
          # inside: the Keystone release and the OS codename. Read both from the
          # built image and compare them with the tag.
          series=${CONTRACT_TAG%%-*}; distro=${CONTRACT_TAG#*-ubuntu_}
          inside=$(docker run --rm --entrypoint /bin/sh "${IMAGE}:${CONTRACT_TAG}" -c \
            '. /etc/os-release; echo "$VERSION_CODENAME"; keystone-manage --version')
          codename=$(printf '%s\n' "$inside" | sed -n 1p); ver=$(printf '%s\n' "$inside" | sed -n 2p)
          # Keystone's major version per series (openstack/releases): 27 = 2025.1, 28 = 2025.2, 29 = 2026.1.
          case "$series" in 2025.1) want=27 ;; 2025.2) want=28 ;; 2026.1) want=29 ;; *) echo "::error::no Keystone major known for series $series: add it here"; exit 1 ;; esac
          echo "tag ${CONTRACT_TAG}: inside keystone ${ver}, ${codename}"
          [ "${ver%%.*}" = "$want" ] || { echo "::error::keystone ${ver} is not ${series} (major ${want})"; exit 1; }
          [ "$codename" = "$distro" ] || { echo "::error::OS ${codename} is not ${distro}"; exit 1; }

      - name: Verify anonymous pullability
        run: |
          set -uo pipefail
          # GHCR packages default to PRIVATE on first publish and do not inherit
          # visibility. The child's kubelet pulls this anonymously, so a private
          # package fails at provisioning with an opaque ImagePullBackOff.
          repo="${GITHUB_REPOSITORY_OWNER,,}/keystone-oidc"
          tok=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" \
                | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
                 -H 'Accept: application/vnd.oci.image.index.v1+json' \
                 "https://ghcr.io/v2/${repo}/manifests/${CONTRACT_TAG}")
          if [ "$code" = "200" ]; then
            echo "public"
          else
            echo "::warning::NOT anonymously pullable (HTTP ${code}) — set the package public"
          fi
